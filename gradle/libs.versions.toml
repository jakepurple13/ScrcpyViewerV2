[versions]
kotlin = "2.3.21"
compose-multiplatform = "1.12.2"
coroutines = "1.11.0"
serialization = "1.11.0"
ffmpeg = "8.1.2-1.5.14"
javacpp = "1.5.14"
navigation3 = "1.1.2"
# Already resolved transitively (navigation3 / koin viewmodel); declared for collectAsStateWithLifecycle.
lifecycle = "2.11.0-beta01"
material3-adaptive = "1.3.0"
qrose = "1.3.1"
koin = "4.2.2"
koin-compiler = "1.2.1"
# Packaging plugin, updater runtime and CI composite actions (.github/workflows/build.yml) move together.
nucleus = "2.5.18"
jna = "5.17.0"

[libraries]
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "material3-adaptive" }
material3-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "material3-adaptive" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-annotations = { module = "io.insert-koin:koin-annotations" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
nucleus-updater = { module = "dev.nucleusframework:nucleus.updater-runtime", version.ref = "nucleus" }
nucleus-application = { module = "dev.nucleusframework:nucleus.nucleus-application", version.ref = "nucleus" }
# The AWT window backend. decorated-window-awt (pulled in by it and by nucleus-application) is only the shared AWT
# base; DecoratedWindow and the title bars live in decorated-window-jni. Ship exactly one backend module.
nucleus-window-awt = { module = "dev.nucleusframework:nucleus.decorated-window-jni", version.ref = "nucleus" }
nucleus-window-material3 = { module = "dev.nucleusframework:nucleus.decorated-window-material3", version.ref = "nucleus" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
koinCompiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-compiler" }
nucleus = { id = "dev.nucleusframework", version.ref = "nucleus" }
