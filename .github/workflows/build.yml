name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# One run per ref: a newer push cancels the run in progress (never a tag's release run).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Tests run per OS in parallel with packaging, so no runner does test + package back to back.
  # Screenshot (-Pscreenshots) and device (-PdeviceTests) tests are excluded by default.
  # On a v* tag each OS also attaches its test report to the release; the release itself does not wait on tests.
  test:
    name: ${{ matrix.os }} (jvmTest)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Linux runtime libraries and Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libfontconfig1

      # Linux: run under a virtual display so any test that touches AWT/Skia has one.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew :composeApp:downloadBundledTools :composeApp:jvmTest --stacktrace

      - name: Test
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew :composeApp:downloadBundledTools :composeApp:jvmTest --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

      # Passing or failing, attach the report once the release job has created the release.
      - name: Attach test report to release
        if: always() && startsWith(github.ref, 'refs/tags/v') && hashFiles('composeApp/build/reports/tests/**') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="test-reports-${{ runner.os }}.tar.gz"
          tar -czf "$archive" -C composeApp/build/reports tests
          # Wait up to 60 minutes for the release; it never appears if packaging failed.
          for _ in $(seq 120); do
            if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              gh release upload "$TAG" "$archive" --clobber --repo "${{ github.repository }}"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Release $TAG not found after 60 minutes; test report not attached."
          exit 1

  build:
    name: ${{ matrix.os }} (${{ matrix.task }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            task: packageDmg
            ext: dmg
          - os: windows-latest
            task: packageMsi
            ext: msi
          - os: ubuntu-latest
            task: packageDeb
            ext: deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build and package
        shell: bash
        run: ./gradlew :composeApp:downloadBundledTools :composeApp:${{ matrix.task }} --stacktrace

      # Only the installer: the same directory tree also holds the unpacked app image.
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyViewer-${{ matrix.ext }}
          path: composeApp/build/compose/binaries/main/${{ matrix.ext }}/*.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.msi
            dist/*.deb
