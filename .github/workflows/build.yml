name: Build

on:
  # Branches with an open PR build through pull_request; pushing to them too ran every job twice.
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One run per ref: a newer push cancels the run in progress (never a tag's release run).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default; only the release job may write.
permissions:
  contents: read

jobs:
  # Tests run per OS in parallel with packaging, so no runner does test + package back to back.
  # Screenshot (-Pscreenshots) and device (-PdeviceTests) tests are excluded by default.
  test:
    name: ${{ matrix.os }} (jvmTest)
    runs-on: ${{ matrix.os }}
    # A run takes about 3-4 minutes; a hung test otherwise holds the runner for GitHub's 6-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # See the build job: the runner's default apt mirror can stall on every package.
      - name: Use the main Ubuntu apt mirror (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          sudo find /etc/apt -name '*.list' -o -name '*.sources' | xargs -r sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g'
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99ci-network

      - name: Install Linux runtime libraries and Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libfontconfig1

      # Linux: run under a virtual display so any test that touches AWT/Skia has one.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew :composeApp:downloadBundledTools :composeApp:jvmTest --stacktrace

      - name: Test
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew :composeApp:downloadBundledTools :composeApp:jvmTest --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

  # The Nucleus plugin packages through electron-builder: macOS DMG + ZIP (the ZIP is what the updater installs),
  # Windows NSIS .exe, Linux .deb, each with a .blockmap for differential updates. macOS builds are ad-hoc signed.
  # Artifact names follow Nucleus' release-assets-<OS>-<arch> convention, which generate-update-yml maps to
  # latest-mac.yml / latest.yml / latest-linux.yml.
  build:
    name: ${{ matrix.os }} (package)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            assets: release-assets-macOS-arm64
          - os: windows-latest
            assets: release-assets-Windows-amd64
          - os: ubuntu-latest
            assets: release-assets-Linux-amd64
    steps:
      - uses: actions/checkout@v4

      # The runner's default apt mirror (azure.archive.ubuntu.com) can stall on every package (20 s each, then a
      # fallback), which makes setup-nucleus's apt-get install take most of an hour. Use the main Ubuntu archive,
      # and give up on a slow connection sooner.
      - name: Use the main Ubuntu apt mirror (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          sudo find /etc/apt -name '*.list' -o -name '*.sources' | xargs -r sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g'
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99ci-network

      # JDK for Gradle (the app's JBR 25 runtime comes from the Gradle toolchain), Node.js for electron-builder,
      # Gradle, and on Linux the packaging tools (fakeroot and friends). Nucleus actions are pinned to the commit of
      # tag v2.5.18; keep it equal to `nucleus` in gradle/libs.versions.toml.
      - uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@765abe7e1bc7f4c422cfa094ec0f3905fce367be # v2.5.18
        with:
          java-version: "21"
          node-version: "24"

      - name: Build and package
        shell: bash
        run: ./gradlew :composeApp:downloadBundledTools :composeApp:packageDistributionForCurrentOS --stacktrace

      # Only the installers and their block maps, one level down (dmg/, zip/, nsis/, deb/): deeper folders hold the
      # unpacked app. The plugin's per-format latest-*.yml are not uploaded; the release job writes merged ones.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.assets }}
          path: |
            composeApp/build/compose/binaries/main/*/*.dmg
            composeApp/build/compose/binaries/main/*/*.zip
            composeApp/build/compose/binaries/main/*/*.exe
            composeApp/build/compose/binaries/main/*/*.deb
            composeApp/build/compose/binaries/main/*/*.blockmap
            !composeApp/build/compose/binaries/main/*/__uninstaller*
          if-no-files-found: error

  release:
    name: Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # One folder per platform (release-assets-*), as generate-update-yml expects.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-assets-*

      # The update metadata takes its version from the tag. A tag that differs from the built appVersion would
      # offer the same release forever, so every platform's files must carry the tag's version.
      - name: Check the tag matches the built version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for dir in artifacts/release-assets-*/; do
            if ! find "$dir" -type f -name "*-${VERSION}-*" | grep -q .; then
              echo "::error::No ${VERSION} installer in $dir. Does appVersion in composeApp/build.gradle.kts match the tag?"
              find "$dir" -type f
              exit 1
            fi
          done

      - uses: NucleusFramework/Nucleus/.github/actions/generate-update-yml@765abe7e1bc7f4c422cfa094ec0f3905fce367be # v2.5.18
        with:
          artifacts-path: artifacts
          version: ${{ env.VERSION }}

      - name: Show update metadata
        shell: bash
        run: |
          for f in artifacts/update-yml/*.yml; do
            echo "--- $(basename "$f")"
            cat "$f"
          done

      # Creates the release as a draft with generated notes and uploads the installers, block maps and merged yml
      # files. A draft is invisible to releases/latest, so no app sees a release whose files are still uploading.
      - uses: NucleusFramework/Nucleus/.github/actions/publish-release@765abe7e1bc7f4c422cfa094ec0f3905fce367be # v2.5.18
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job has no checkout, so gh needs the repository named.
          GH_REPO: ${{ github.repository }}
        with:
          artifacts-path: artifacts
          tag: ${{ github.ref_name }}
          release-type: draft

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
