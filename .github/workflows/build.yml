name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# One run per ref: a newer push cancels the run in progress (never a tag's release run).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.task }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            task: packageReleaseDmg
            ext: dmg
          - os: windows-latest
            task: packageReleaseMsi
            ext: msi
          - os: ubuntu-latest
            task: packageReleaseDeb
            ext: deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Linux runtime libraries and Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libfontconfig1 fakeroot

      # Linux: run under a virtual display so any test that touches AWT/Skia has one.
      # Screenshot (-Pscreenshots) and device (-PdeviceTests) tests are excluded by default.
      - name: Build, test and package (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew :composeApp:downloadBundledTools :composeApp:jvmTest :composeApp:${{ matrix.task }} --stacktrace

      - name: Build, test and package
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew :composeApp:downloadBundledTools :composeApp:jvmTest :composeApp:${{ matrix.task }} --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

      # Only the installer: the same directory tree also holds the unpacked app image.
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyViewer-${{ matrix.ext }}
          path: composeApp/build/compose/binaries/main-release/${{ matrix.ext }}/*.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.msi
            dist/*.deb
